name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt
        
    - name: Format with black
      run: |
        black --check .
        
    - name: Lint with ruff
      run: |
        ruff check .
        
    - name: Type check with mypy
      run: |
        mypy . --ignore-missing-imports
      continue-on-error: true
        
    - name: Test with pytest
      run: |
        pytest -q --tb=short
        
    - name: Coverage
      run: |
        pytest --cov --cov-report=term-missing --cov-fail-under=60
        
    - name: Security scan with bandit
      run: |
        bandit -r . -c pyproject.toml -ll
        
    - name: Dependency scan with pip-audit
      run: |
        pip-audit -r requirements.txt --ignore-vuln CVE-2023-XXXXX # adjust as needed
      continue-on-error: true
        
    - name: Import smoke test
      run: |
        python -c "import config; import market_calendar; import data_fetcher"
